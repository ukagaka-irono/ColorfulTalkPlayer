# Web 版を GitHub Pages に公開する。辞書は Colorful-dictionary のリリースから取得し、SHA-256 を確かめる。
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/fetch-dic.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 辞書を取得
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 --repo ukagaka-irono/Colorful-dictionary --pattern colorful_talk.dic --dir dl
          bash scripts/fetch-dic.sh dl/colorful_talk.dic
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
