[package]
name = "colorful-talk-player"
version = "1.0.0"
description = "ColorfulTalk の公式読み上げアプリ（Windows / Mac 版）"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "ColorfulTalkPlayer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
